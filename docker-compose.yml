version: '3.8'

services:
  db:
    image: postgres:16
    container_name: devboard_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: devboard
      POSTGRES_USER: devboard_user
      POSTGRES_PASSWORD: devboard_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devboard_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devboard_user -d devboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devboard_backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/devboard
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/devboard
      SPRING_DATASOURCE_USERNAME: devboard_user
      SPRING_DATASOURCE_PASSWORD: devboard_pass
      JWT_SECRET: ${JWT_SECRET:-devboard_super_secret_jwt_key_change_this_in_production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devboard_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devboard_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - devboard_network

volumes:
  postgres_data:

networks:
  devboard_network:
    driver: bridge