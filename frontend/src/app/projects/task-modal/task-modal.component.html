@if (open()) {
  <div class="backdrop" (click)="onBackdropClick($event)" role="presentation">
    <div class="modal card" role="dialog" aria-modal="true" aria-labelledby="task-modal-title" (click)="$event.stopPropagation()">
      <h2 id="task-modal-title">New task</h2>
      <form [formGroup]="form" (ngSubmit)="save()">
        <label>
          <span>Title</span>
          <input type="text" formControlName="title" />
          @if (form.controls.title.invalid && form.controls.title.touched) {
            <small class="field-error">Title is required</small>
          }
        </label>
        <label>
          <span>Description (optional)</span>
          <textarea rows="3" formControlName="description"></textarea>
        </label>
        <label>
          <span>Status</span>
          <select formControlName="status">
            @for (s of statuses; track s) {
              <option [value]="s">{{ s }}</option>
            }
          </select>
        </label>
        <div class="actions">
          <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
          <button type="submit" class="btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>
}
