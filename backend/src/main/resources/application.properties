# Application properties
spring.application.name=devboard

# Database properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devboard}
spring.datasource.username=${DB_USER:devboard_user}
spring.datasource.password=${DB_PASSWORD:devboard_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT properties
jwt.secret=${JWT_SECRET:devboard_super_secret_jwt_key_that_is_long_enough_for_hs256_algorithm_2026}
jwt.expiration=${JWT_EXPIRATION:86400000}